<body>
    <div id="analyticspageheader" class="main_header">
        <nav class="nav-container">
    <div class="logo">
        <img src="#" alt="logo" style="width: 150px; height: 100px;">
    </div>

    <ul>
        <li class="analytics_header active">
            <a href="#" class="navelement">Analytics</a>
        </li>

        <li class="catalog_header">
            <a href="catalog.html" class="navelement">Catalog</a>
        </li>

        <li class="about_header">
            <a href="about.html" class="navelement">About Us</a>
        </li>
    </ul>
</nav>
    </div>
    <div id="analytics_body">
        <div id="analytics_textinfo">
            <h1>Children's Health Analytics</h1>
            <h4>Comprehensive overview of health data for all children in residence · Updated Sep 2026</h4>
        </div>
        <div id="bg-emoji-layer"></div>
        <div class="counter_box">
        <div class="stat-card" id="populationcounter">
            <div class="fisrtline">
            <div class="card-icon">👶</div>
            <div class="card-title">TOTAL CHILDREN</div>
            </div>
            <div class="card-number">12</div>
            <div class="card-subtitle">in residence</div>
        <!-- it will display the total number of children's in NGO -->
    </div>

        <!-- <div class="sub_counter"> -->
        <div class="stat-card" id="medicalcounter">
            <div class="fisrtline">
            <div class="card-icon">📋</div>
            <div class="card-title">MEDICAL REPORTS</div>
        </div>
            <div class="card-number">12</div>
            <div class="card-subtitle">are available</div>
            <!-- it will display the number of medical reports registered in catalog -->
        </div>
        <div class="stat-card" id="vaccinecounter">
            <div class="fisrtline">
            <div class="card-icon">💉</div>
            <div class="card-title">VACCINATED CHILDREN</div>
            </div>
            <div class="card-number">12</div>
            <div class="card-subtitle">from residence</div>
            <!-- it will display the number of vaccinated children's registered in catalog -->
        </div>
        <div class="stat-card" id="checkupcounter">
            <div class="fisrtline">
            <div class="card-icon">🩺</div>
            <div class="card-title">PREVIOUS CHECKUPS</div>
            </div>
            <div class="card-number">12</div>
            <div class="card-subtitle">have done</div>
            <!-- it will display the number of previous checkups registered in catalog -->
        </div>
</div>
    </div>
    <script src="script.js"></script>
</body>
